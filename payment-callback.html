<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Complete – AbikCare</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #16A34A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }

    .icon {
      width: 72px;
      height: 72px;
      background: #ECFDF5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 36px;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 8px;
    }

    p {
      color: #6B7280;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #E5E7EB;
      border-top-color: #16A34A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn {
      display: inline-block;
      background: #16A34A;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 32px;
      border-radius: 14px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      width: 100%;
    }

    .brand {
      font-size: 13px;
      color: #9CA3AF;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Payment Successful!</h1>
    <p>Your order has been confirmed. Redirecting you back to the AbikCare app...</p>
    <div class="spinner"></div>
    <a href="abikcaremobile://payment" class="btn" id="openBtn">
      Open AbikCare App
    </a>
    <p class="brand">AbikCare — Everything You Need, Delivered Fast</p>
  </div>

  <script>
    // Immediately try to redirect to the app
    window.location.href = "abikcaremobile://payment";

    // Also try after a short delay (some browsers need this)
    setTimeout(function () {
      window.location.href = "abikcaremobile://payment";
    }, 500);

    // If still on page after 3 seconds, show the button prominently
    setTimeout(function () {
      document.getElementById("openBtn").style.backgroundColor = "#166534";
      document.getElementById("openBtn").textContent = "Tap here to open the app";
    }, 3000);
  </script>
</body>
</html>
